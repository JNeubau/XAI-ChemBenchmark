output_path: '../results/'
train:
  model_type: 'RFReg'
  metrics:  ['smape', 'mape', 'rmse', 'pairwise_accuracy_score', 'ndcg_score']
data:
  cof_dataset:
    target_column: 'capacity_max'
    data_path: '../data/cof_data/'
