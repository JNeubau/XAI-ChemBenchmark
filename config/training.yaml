    num_bins: 10
  polymers_data:
    target_column: 'Tg'
    data_path: '../data/polymers_data/'
    num_splits: 10
    num_bins: 10
  redox_data:
    target_column: 'dGox'
    data_path: '../data/redox_data/'
    num_splits: 10
    num_bins: 10
  synthetic_data:
